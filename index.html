<script>
/* ---------- ตารางอักษร ---------- */
const TC = {
  ก:'က',ข:'ခ',ค:'ဂ',ฆ:'ဃ',ง:'င',
  จ:'စ',ฉ:'ဆ',ช:'ဇ',ฌ:'ဈ',ญ:'ဉ',
  ฏ:'ဋ',ฐ:'ဌ',ฑ:'ဍ',ฒ:'ဎ',ณ:'ဏ',
  ต:'တ',ถ:'ထ',ท:'ဒ',ธ:'ဓ',น:'န',
  ป:'ပ',ผ:'ဖ',พ:'ဗ',ภ:'ဘ',ม:'မ',
  ย:'ယ',ร:'ရ',ล:'လ',ว:'ဝ',
  ส:'သ',ห:'ဟ',ฬ:'ဠ'
};
const VS  = {'า':'ā','ิ':'i','ี':'ī','ุ':'u','ู':'ū'};           // สระจมไทย
const VB  = {a:'',ā:'ာ',i:'ိ',ī:'ီ',u:'ု',ū:'ူ',e:'ေ',o:'ော'};      // สระจมพม่า
const IND = {a:'အ',ā:'အာ',i:'ဣ',ī:'ဤ',u:'ဥ',ū:'ဦ',e:'ဧ',o:'ဩ'};   // สระลอยพม่า
const DIGIT = {'๐':'၀','๑':'၁','๒':'၂','๓':'၃','๔':'၄','๕':'၅','๖':'၆','๗':'၇','๘':'၈','๙':'၉'};
const VIRAMA = '္', ASAT = '်', NIGG = 'ံ';
/* มาตรฐาน Unicode พม่า: หลัง ခ ဂ င ဒ ပ ဝ ใช้ สระอา สูง ါ (U+102B) และ ေါ ; หลังตัวอื่นใช้ ာ (U+102C) และ ော */
const TALL = 'ခဂငဒပဝ';
const VBT = {ā:'ါ', o:'ေါ'};
function burmeseNormalize(t) {
  return t.normalize('NFC').replace(/([\u1000-\u1021\u103F])(\u1031)?([\u102B\u102C])/g,
    (m, c, e, a) => c + (e || '') + (TALL.includes(c) ? '\u102B' : '\u102C'));
}

/* เครื่องหมายซ้อนพม่า: ย ร ว ห ที่เป็นตัวซ้อน → สระเสริม ျ ြ ွ ှ ; ง นำหน้า → กินซี င်္ ; ตัวอื่นซ้อนด้วย ္ */
const MEDT = {'ย':'\u103B','ร':'\u103C','ว':'\u103D','ห':'\u103E'};   // ไทย → พม่า
const MEDB = {'\u103B':'ย','\u103C':'ร','\u103D':'ว','\u103E':'ห'};   // พม่า → ไทย
const MEDU = {'\u103B':'y','\u103C':'r','\u103D':'v','\u103E':'h'};   // พม่า → หน่วยเสียง
function buildCluster(cs) {
  let s = '', med = [], i;
  const flush = () => { if (med.length) { s += med.sort().join(''); med = []; } };
  if (cs[0] === 'ง' && cs.length > 1 && !(cs[1] in MEDT)) { s = TC['ง'] + ASAT + VIRAMA + TC[cs[1]]; i = 2; }
  else { s = TC[cs[0]]; i = 1; }
  for (; i < cs.length; i++) {
    const c = cs[i];
    if (c in MEDT) med.push(MEDT[c]);
    else { flush(); s += VIRAMA + TC[c]; }
  }
  const endsMed = med.length > 0;
  flush();
  return { s: s.replace('ဉ္ဉ', 'ည').replace('သ္သ', 'ဿ'), med: endsMed };
}

/* ---------- แปลงไทย → พม่า ---------- */
function thaiToBurmese(text) {
  text = text.replace(/\uF700/g, 'ฐ').replace(/\uF70F/g, 'ญ').normalize('NFC');
  let out = '', i = 0;
  const n = text.length;
  while (i < n) {
    const ch = text[i];
    let pre = null, k = i;
    if ((ch === 'เ' || ch === 'โ') && i + 1 < n && (text[i+1] in TC || text[i+1] === 'อ')) {
      pre = ch; k = i + 1;
    }
    if (pre || ch in TC || ch === 'อ') {
      /* สระลอย (อ...) */
      if (text[k] === 'อ') {
        k++;
        let v = 'a';
        if (pre) v = pre === 'เ' ? 'e' : 'o';
        else if (text[k] in VS) { v = VS[text[k]]; k++; }
        out += IND[v];
        if (text[k] === 'ํ') { out += NIGG; k++; }
        i = k; continue;
      }
      /* พยัญชนะ (+ ฺ พยัญชนะ)* + สระ */
      const cons = []; let dead = false;
      while (true) {
        cons.push(text[k]); k++;
        if (text[k] === 'ฺ') {
          k++;
          if (k < n && text[k] in TC) continue;
          if (k + 1 < n && (text[k] === 'เ' || text[k] === 'โ') && text[k+1] in TC) { pre = text[k]; k++; continue; }
          dead = true;
        }
        break;
      }
      const cl = buildCluster(cons);
      let s = cl.s;
      if (dead) {
        s += ASAT;
      } else {
        let v = 'a';
        if (pre) v = pre === 'เ' ? 'e' : 'o';
        else if (text[k] in VS) { v = VS[text[k]]; k++; }
        s += (!cl.med && TALL.includes(TC[cons[cons.length - 1]]) && VBT[v]) ? VBT[v] : VB[v];
      }
      if (text[k] === 'ํ') { s += NIGG; k++; }
      out += s; i = k; continue;
    }
    if (ch === 'ํ') { out += NIGG; i++; continue; }
    out += (ch in DIGIT) ? DIGIT[ch] : ch;
    i++;
  }
  return out;
}

/* ---------- แปลงพม่า → ไทย ---------- */
const BT = {}; for (const t in TC) BT[TC[t]] = t;
const TV = {a:'',ā:'า',i:'ิ',ī:'ี',u:'ุ',ū:'ู'};
const TIND = {a:'อ',ā:'อา',i:'อิ',ī:'อี',u:'อุ',ū:'อู',e:'เอ',o:'โอ'};
const BDIGIT = {}; for (const t in DIGIT) BDIGIT[DIGIT[t]] = t;
function burmeseToThai(text) {
  text = text.replace(/\uF700/g, 'ฐ').replace(/\uF70F/g, 'ญ').normalize('NFC');
  let out = '', i = 0; const n = text.length;
  const isC = c => c in BT || c === 'ည' || c === 'ဿ';
  function readVowel(defA) {
    let v = null;
    if (text[i] === 'ေ') {
      if (text[i+1] === 'ာ' || text[i+1] === 'ါ') { v = 'o'; i += 2; } else { v = 'e'; i++; }
    } else if (text[i] in BVS) { v = BVS[text[i]]; i++; }
    if (v === null && defA) v = 'a';
    return v;
  }
  while (i < n) {
    let ch = text[i];
    if (ch === 'အ') {
      i++; out += TIND[readVowel(true)];
      if (text[i] === 'ံ') { out += 'ํ'; i++; }
    } else if (ch in BIND) {
      out += TIND[BIND[ch]]; i++;
      if (text[i] === 'ံ') { out += 'ํ'; i++; }
    } else if (isC(ch)) {
      const cons = [];
      while (true) {
        cons.push(ch === 'ည' ? 'ญฺญ' : ch === 'ဿ' ? 'สฺส' : BT[ch]);
        i++;
        while (true) {
          if (text[i] in MEDB) { cons.push(MEDB[text[i]]); i++; }
          else if (text[i] === ASAT && text[i+1] === VIRAMA && i + 2 < n && isC(text[i+2]) && cons[cons.length - 1] === 'ง') { i++; }   // กินซี င်္
          else break;
        }
        if (text[i] === VIRAMA && i + 1 < n && isC(text[i+1])) { ch = text[i+1]; i++; continue; }
        break;
      }
      const last = cons.pop();
      const s = cons.map(c => c + 'ฺ').join('');   // ทุกตัวก่อนตัวสุดท้ายเป็นตัวซ้อน
      if (text[i] === ASAT) {
        i++; out += s + last + 'ฺ';
      } else {
        const v = readVowel(true);
        if (v === 'e' || v === 'o') {
          // สระหน้า วางหน้าตัวสุดท้ายของกลุ่ม (ตฺเต, ธมฺโม)
          const lc = last.slice(-1), head = last.slice(0, -1);
          out += s + head + (v === 'e' ? 'เ' : 'โ') + lc;
        } else out += s + last + TV[v];
        if (text[i] === 'ံ') { out += 'ํ'; i++; }
      }
    } else if (ch === 'ံ') { out += 'ํ'; i++; }
    else { out += (ch in BDIGIT) ? BDIGIT[ch] : ch; i++; }
  }
  return out;
}

/* ---------- เรียงอักษรบาลี ---------- */
const ORDER = ['a','ā','i','ī','u','ū','e','o','ṃ',
  'k','kh','g','gh','ṅ','c','ch','j','jh','ñ','ṭ','ṭh','ḍ','ḍh','ṇ',
  't','th','d','dh','n','p','ph','b','bh','m','y','r','l','v','s','h','ḷ'];
const RANK = {}; ORDER.forEach((p, i) => RANK[p] = i);

const TROM = {ก:'k',ข:'kh',ค:'g',ฆ:'gh',ง:'ṅ',จ:'c',ฉ:'ch',ช:'j',ฌ:'jh',ญ:'ñ',
  ฏ:'ṭ',ฐ:'ṭh',ฑ:'ḍ',ฒ:'ḍh',ณ:'ṇ',ต:'t',ถ:'th',ท:'d',ธ:'dh',น:'n',
  ป:'p',ผ:'ph',พ:'b',ภ:'bh',ม:'m',ย:'y',ร:'r',ล:'l',ว:'v',ส:'s',ห:'h',ฬ:'ḷ'};
const BROM = {};
for (const t in TC) BROM[TC[t]] = TROM[t];
const BVS = {'ာ':'ā','ါ':'ā','ိ':'i','ီ':'ī','ု':'u','ူ':'ū'};
const BIND = {'ဣ':'i','ဤ':'ī','ဥ':'u','ဦ':'ū','ဧ':'e','ဩ':'o','ဪ':'o'};

/* คำอักษรไทย -> หน่วยเสียงบาลี */
function thaiUnits(text, keep) {
  text = text.replace(/\uF700/g, 'ฐ').replace(/\uF70F/g, 'ญ');
  const u = []; let i = 0; const n = text.length;
  while (i < n) {
    const ch = text[i]; let pre = null, k = i;
    if ((ch === 'เ' || ch === 'โ') && i + 1 < n && (text[i+1] in TC || text[i+1] === 'อ')) { pre = ch; k = i + 1; }
    if (pre || ch in TC || ch === 'อ') {
      if (text[k] === 'อ') {
        k++; let v = 'a';
        if (pre) v = pre === 'เ' ? 'e' : 'o';
        else if (text[k] in VS) { v = VS[text[k]]; k++; }
        u.push(v);
        if (text[k] === 'ํ') { u.push('ṃ'); k++; }
        i = k; continue;
      }
      let dead = false;
      while (true) {
        u.push(TROM[text[k]]); k++;
        if (text[k] === 'ฺ') { k++; if (k < n && text[k] in TC) continue; dead = true; }
        break;
      }
      if (!dead) {
        let v = 'a';
        if (pre) v = pre === 'เ' ? 'e' : 'o';
        else if (text[k] in VS) { v = VS[text[k]]; k++; }
        u.push(v);
      }
      if (text[k] === 'ํ') { u.push('ṃ'); k++; }
      i = k; continue;
    }
    if (ch === 'ํ') u.push('ṃ'); else if (keep) u.push('\0' + ch);
    i++;
  }
  return u;
}

/* คำอักษรพม่า -> หน่วยเสียงบาลี */
function burmeseUnits(text) {
  text = text.normalize('NFC');
  const u = []; let i = 0; const n = text.length;
  function vowel(defA) {
    let v = null;
    if (text[i] === 'ေ') {
      if (text[i+1] === 'ာ' || text[i+1] === 'ါ') { v = 'o'; i += 2; } else { v = 'e'; i++; }
    } else if (text[i] in BVS) { v = BVS[text[i]]; i++; }
    if (v === null && defA) v = 'a';
    if (v) u.push(v);
    if (text[i] === 'ံ') { u.push('ṃ'); i++; }
  }
  while (i < n) {
    let ch = text[i];
    if (ch === 'အ') { i++; vowel(true); }
    else if (ch in BIND) { u.push(BIND[ch]); i++; if (text[i] === 'ံ') { u.push('ṃ'); i++; } }
    else if (ch in BROM || ch === 'ည' || ch === 'ဿ') {
      const isCC = c => c in BROM || c === 'ည' || c === 'ဿ';
      while (true) {
        if (ch === 'ည') u.push('ñ', 'ñ');
        else if (ch === 'ဿ') u.push('s', 's');
        else u.push(BROM[ch]);
        i++;
        while (true) {
          if (text[i] in MEDU) { u.push(MEDU[text[i]]); i++; }
          else if (text[i] === ASAT && text[i+1] === VIRAMA && i + 2 < n && isCC(text[i+2]) && ch === 'င') { i++; }
          else break;
        }
        if (text[i] === VIRAMA && i + 1 < n && isCC(text[i+1])) { ch = text[i+1]; i++; continue; }
        break;
      }
      if (text[i] === ASAT) { i++; if (text[i] === 'ံ') { u.push('ṃ'); i++; } }
      else vowel(true);
    }
    else if (ch === 'ံ') { u.push('ṃ'); i++; }
    else i++;
  }
  return u;
}

/* ---------- อักษรโรมัน (IAST) ---------- */
const ROM2T = {}; for (const t in TROM) ROM2T[TROM[t]] = t;
const RASP = ORDER.filter(p => p.length === 2), RVOW = ORDER.slice(0, 8).join(''), RNIG = ORDER[8];
const T2A = {}; '๐๑๒๓๔๕๖๗๘๙'.split('').forEach((d, i) => T2A[d] = String(i));
function romanTokens(text) {
  text = text.normalize('NFC').toLowerCase().replace(/\u1E41/g, RNIG);
  const tk = []; let i = 0; const n = text.length;
  while (i < n) {
    const c = text[i], d = c + (text[i+1] || '');
    if (RASP.includes(d)) { tk.push({k:'c', v:d}); i += 2; }
    else if (c in ROM2T) { tk.push({k:'c', v:c}); i++; }
    else if (RVOW.includes(c)) { tk.push({k:'v', v:c}); i++; }
    else if (c === RNIG) { tk.push({k:'m'}); i++; }
    else { tk.push({k:'x', v:c}); i++; }
  }
  return tk;
}
function romanUnits(w) { return romanTokens(w).filter(t => t.k !== 'x').map(t => t.k === 'm' ? RNIG : t.v); }
/* โรมัน → ไทย: พยัญชนะที่ตามด้วยพยัญชนะ = ตัวสะกด/ซ้อน (ฺ), พยัญชนะท้ายไม่มีสระ = ฺ */
function romanToThai(text) {
  const tk = romanTokens(text), n = tk.length; let out = '', i = 0;
  const NIK = '\u0E4D', PHI = '\u0E3A';
  while (i < n) {
    const t = tk[i];
    if (t.k === 'v') { out += TIND[t.v]; i++; if (i < n && tk[i].k === 'm') { out += NIK; i++; } }
    else if (t.k === 'c') {
      let s = '';
      while (i + 1 < n && tk[i].k === 'c' && tk[i+1].k === 'c') { s += ROM2T[tk[i].v] + PHI; i++; }
      const last = ROM2T[tk[i].v]; i++;
      if (i < n && tk[i].k === 'v') {
        const v = tk[i].v; i++;
        s += v === 'e' ? '\u0E40' + last : v === 'o' ? '\u0E42' + last : last + TV[v];
      } else s += last + PHI;
      if (i < n && tk[i].k === 'm') { s += NIK; i++; }
      out += s;
    }
    else if (t.k === 'm') { out += NIK; i++; }
    else { out += t.v; i++; }
  }
  return out;
}
/* ไทย → โรมัน (ตัวอักษรอื่นคงเดิม เลขไทย → เลขอารบิก) */
function thaiToRoman(text) {
  let s = thaiUnits(text, true).map(x => {
    if (x[0] !== '\0') return x;
    const c = x.slice(1); return c in T2A ? T2A[c] : c;
  }).join('');
  if (document.getElementById('optCap').checked) s = s.replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase());
  return s;
}

function sortKey(w) {
  const units = /[\u1000-\u109F]/.test(w) ? burmeseUnits(w) : /[\u0E00-\u0E7F]/.test(w) ? thaiUnits(w) : romanUnits(w);
  return units.map(x => RANK[x]);
}
function cmpKey(a, b) {
  const m = Math.min(a.length, b.length);
  for (let i = 0; i < m; i++) if (a[i] !== b[i]) return a[i] - b[i];
  return a.length - b.length;
}

/* ---------- นับคำ: ช่องว่าง/ขึ้นบรรทัดใหม่ กี่ตัวติดกันก็นับเป็นตัวแบ่งคำเดียว ---------- */
function countWords(t) {
  const m = t.trim().match(/\S+/g);
  return m ? m.length : 0;
}
function updateCounts() {
  const t = document.getElementById('inputText').value;
  document.getElementById('wordCount').textContent = countWords(t).toLocaleString();
  document.getElementById('charCount').textContent = t.length.toLocaleString();
}
function toTarget(s, tgt) {
  if (tgt === 'thai') return romanToThai(burmeseToThai(s));
  if (tgt === 'roman') return thaiToRoman(burmeseToThai(s));
  return burmeseNormalize(thaiToBurmese(romanToThai(s)));
}
function convertText(tgt) {
  const r = toTarget(document.getElementById('inputText').value, tgt);
  document.getElementById('outputText').value = r;
  document.getElementById('outWordCount').textContent = countWords(r).toLocaleString();
}
function sortText() {
  const src = document.getElementById('inputText').value;
  let words = (src.match(/\S+/g) || []).map(w => ({w, k: sortKey(w)}));
  if (document.getElementById('optUnique').checked) {
    const seen = new Set();
    words = words.filter(x => {
      const id = x.k.length ? x.k.join(',') : 'w:' + x.w;
      if (seen.has(id)) return false;
      seen.add(id); return true;
    });
  }
  words.sort((a, b) => cmpKey(a.k, b.k));
  if (document.getElementById('optReverse').checked) words.reverse();
  const tgt = document.querySelector('input[name=tgt]:checked').value;
  const r = words.map(x => toTarget(x.w, tgt)).join('\n');
  document.getElementById('outputText').value = r;
  document.getElementById('outWordCount').textContent = words.length.toLocaleString();
}
function copyText() {
  const o = document.getElementById('outputText');
  o.select();
  if (navigator.clipboard) navigator.clipboard.writeText(o.value); else document.execCommand('copy');
}
function resetText() {
  document.getElementById('inputText').value = '';
  document.getElementById('outputText').value = '';
  document.getElementById('outWordCount').textContent = '0';
  updateCounts();
}
document.getElementById('inputText').addEventListener('input', updateCounts);

/* ช่องใส่ข้อมูล = ไทยปกติ (ฐ ญ มีเชิง) / ช่องผลลัพธ์ = บาลีไทย (ฐ ญ ไม่มีเชิง)
   ตัวอักษรยังเป็น ฐ U+0E10 และ ญ U+0E0D ปกติ เปลี่ยนเฉพาะรูปที่แสดงด้วยฟอนต์ */
function applyCut() {
  document.getElementById('inputText').classList.add('tho-th');
  document.getElementById('outputText').classList.add('tho-cut');
}
applyCut();
/* ส่งความสูงให้หน้าแม่ปรับ iframe อัตโนมัติ */
if (window.parent !== window && window.ResizeObserver) {
  const postH = () => parent.postMessage({convertH: document.documentElement.scrollHeight}, '*');
  new ResizeObserver(postH).observe(document.body); postH();
}
